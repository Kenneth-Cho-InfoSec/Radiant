name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to attach the APK to
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358
            cmake;3.31.6

      - name: Restore release signing key
        env:
          RADIANT_SIGNING_KEYSTORE_BASE64: ${{ secrets.RADIANT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$RADIANT_SIGNING_KEYSTORE_BASE64"
          printf '%s' "$RADIANT_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radiant-release.p12"
          chmod 600 "$RUNNER_TEMP/radiant-release.p12"

      - name: Build signed ARM64 APK
        env:
          RADIANT_SIGNING_STORE_FILE: ${{ runner.temp }}/radiant-release.p12
          RADIANT_SIGNING_STORE_PASSWORD: ${{ secrets.RADIANT_SIGNING_STORE_PASSWORD }}
          RADIANT_SIGNING_KEY_ALIAS: ${{ secrets.RADIANT_SIGNING_KEY_ALIAS }}
          RADIANT_SIGNING_KEY_PASSWORD: ${{ secrets.RADIANT_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Prepare versioned APK asset
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG##*v}"
          apk="$RUNNER_TEMP/Radiant-${version}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          echo "RADIANT_RELEASE_APK=$apk" >> "$GITHUB_ENV"

      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs
          "$RADIANT_RELEASE_APK"

      - name: Attach APK to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$RADIANT_RELEASE_APK" --clobber
